name = "tempmail-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "tempmail-db"
database_id = "0336632c-e4d8-4947-b01b-0df3e9aa5d5b"

[triggers]
crons = ["*/15 * * * *"]

[email]


[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
# Invocation logs contain request URLs (which include mailbox addresses), so keep them off:
# otherwise addresses would be retained in logs long after the emails are deleted.
invocation_logs = false

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
